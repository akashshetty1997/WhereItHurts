[project]
name = "whereithurts-backend"
version = "0.1.0"
description = "WhereItHurts API: sentence extraction and speech-to-text with speaker diarization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "numpy>=2",
    "sherpa-onnx>=2.0.1",
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
